<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz do Daniel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
  /* Layout: um cartão central em cima de "glacê"; o bolo com 3 velas é o placar. Visual único (festa), sem modo escuro por escolha. */
  :root {
    --frosting: #ffe3ea;
    --frosting-deep: #ffc2d1;
    --cocoa: #3b1f14;
    --cocoa-soft: #6e4636;
    --card: #fffaf5;
    --flame: #ffb020;
    --mint: #18a58a;
    --cherry: #d7263d;
    --display: "Bagel Fat One", "Arial Black", system-ui, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 12% 18%, var(--flame) 0 3px, transparent 4px) 0 0 / 90px 90px,
      radial-gradient(circle at 60% 70%, var(--mint) 0 3px, transparent 4px) 0 0 / 110px 110px,
      radial-gradient(circle at 80% 30%, var(--cherry) 0 3px, transparent 4px) 0 0 / 130px 130px,
      var(--frosting);
    color: var(--cocoa);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2rem, 8vw, 2.9rem);
    line-height: 1.05;
    margin: 0;
    text-align: center;
    text-wrap: balance;
  }
  .sub { text-align: center; margin: 0; color: var(--cocoa-soft); }

  /* bolo/placar */
  .cake { display: flex; flex-direction: column; align-items: center; }
  .candles { display: flex; gap: 34px; height: 64px; align-items: flex-end; }
  .candle { position: relative; width: 14px; height: 40px; border-radius: 3px;
    background: repeating-linear-gradient(135deg, var(--card) 0 6px, var(--cherry) 6px 11px); }
  .candle::before { content: ""; position: absolute; left: 50%; top: -7px; width: 2px; height: 7px; background: var(--cocoa); transform: translateX(-50%); }
  .flame { position: absolute; left: 50%; bottom: 46px; width: 14px; height: 20px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff6c2 0 30%, var(--flame) 60%);
    transform: translateX(-50%) scale(0); transform-origin: 50% 100%; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
  .candle.lit .flame { transform: translateX(-50%) scale(1); animation: flicker 1.1s ease-in-out infinite alternate; }
  .candle.out .flame { transform: translateX(-50%) scale(0); }
  @keyframes flicker { from { transform: translateX(-50%) scale(1) rotate(-3deg); } to { transform: translateX(-50%) scale(.9, 1.08) rotate(3deg); } }
  .tier { width: 190px; height: 44px; background: var(--cocoa-soft); border-radius: 10px 10px 4px 4px; position: relative; }
  .tier::before { content: ""; position: absolute; inset: 0 0 auto; height: 16px; border-radius: 10px 10px 0 0;
    background: radial-gradient(circle at 10px 16px, var(--card) 9px, transparent 10px) 0 0 / 20px 22px, linear-gradient(var(--card), var(--card)) 0 0 / 100% 8px no-repeat; }
  .plate { width: 230px; height: 8px; border-radius: 4px; background: var(--cocoa); }
  .score { margin-top: 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--cocoa-soft); font-weight: 700; }

  /* cartão */
  .card { background: var(--card); border: 3px solid var(--cocoa); border-radius: 18px; box-shadow: 6px 6px 0 var(--cocoa);
    padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; }
  .eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--cherry); margin: 0; }
  .q { font-family: var(--display); font-weight: 400; font-size: clamp(1.35rem, 5vw, 1.7rem); line-height: 1.2; margin: 0; text-wrap: balance; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 420px) { .opts { grid-template-columns: 1fr; } }
  button { font: inherit; cursor: pointer; }
  .opt { text-align: left; padding: 14px 14px; border: 2px solid var(--cocoa); border-radius: 12px; background: var(--frosting);
    color: var(--cocoa); font-weight: 500; transition: transform .12s, background .12s; }
  .opt:hover { background: var(--frosting-deep); transform: translateY(-2px); }
  .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--flame); outline-offset: 2px; }
  .opt.wrong { background: var(--cherry); color: var(--card); animation: shake .35s; }
  .opt.right { background: var(--mint); color: var(--card); }
  .opt:disabled { cursor: default; transform: none; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .feedback { min-height: 1.5em; margin: 0; font-weight: 500; }
  .feedback.bad { color: var(--cherry); }
  .feedback.good { color: var(--mint); }
  .btn { align-self: flex-start; padding: 14px 22px; border: 3px solid var(--cocoa); border-radius: 999px; background: var(--flame);
    color: var(--cocoa); font-weight: 700; box-shadow: 3px 3px 0 var(--cocoa); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--cocoa); }

  .code-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .code { font-family: var(--mono); font-size: clamp(1rem, 4.6vw, 1.25rem); background: var(--cocoa); color: var(--flame);
    padding: 12px 14px; border-radius: 10px; letter-spacing: .04em; user-select: all; min-width: 0; overflow-wrap: anywhere; }
  .fine { font-size: .9rem; color: var(--cocoa-soft); margin: 0; }
  canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<canvas id="confetti"></canvas>
<main class="wrap">
  <h1>Feliz aniversário, Daniel!</h1>
  <p class="sub">Três perguntas dificílimas. Acerta tudo e ganha um presente.</p>

  <div class="cake" aria-hidden="true">
    <div class="candles">
      <div class="candle" id="c0"><span class="flame"></span></div>
      <div class="candle" id="c1"><span class="flame"></span></div>
      <div class="candle" id="c2"><span class="flame"></span></div>
    </div>
    <div class="tier"></div>
    <div class="plate"></div>
  </div>
  <p class="score" id="score">0 de 3 velas acesas</p>

  <section class="card" id="card" aria-live="polite"></section>
</main>

<script>
  // ===== Edite aqui =====
  const PERGUNTAS = [
    { q: "Qual era a cor do cavalo branco de Napoleão?",
      opts: ["Preto", "Malhado", "Branco", "Napoleão andava de Uber"], certa: 2 },
    { q: "Quantos meses do ano têm 28 dias?",
      opts: ["Só fevereiro", "Dois", "Todos os 12", "Nenhum, é tudo fake"], certa: 2 },
    { q: "Um galo bota um ovo bem no topo do telhado. Pra que lado o ovo rola?",
      opts: ["Pra esquerda", "Pra direita", "Depende do vento", "Galo não bota ovo"], certa: 3 },
  ];
  const CODIGO_B64 = "Qk9MTy0yMTExLVZFTEFTLUFDRVNBUw=="; // código fixo, só pra não aparecer de cara no código-fonte
  const ZOEIRAS = [
    "Errou. Mais um ano de vida e ainda isso?",
    "Não. Tenta de novo, sem pressa, a idade pesa.",
    "Errado. O bolo tá olhando com decepção.",
    "Quase... não, nem quase.",
  ];
  // ======================

  const card = document.getElementById("card");
  const score = document.getElementById("score");
  let atual = 0, erros = 0;

  function vela(i, estado) { document.getElementById("c" + i).className = "candle " + estado; }
  function placar(n) { score.textContent = n + " de 3 velas acesas"; }

  function render() {
    const p = PERGUNTAS[atual];
    card.innerHTML = "";
    const eb = el("p", "eyebrow", "Pergunta " + (atual + 1) + " de " + PERGUNTAS.length);
    const q = el("h2", "q", p.q);
    const opts = el("div", "opts");
    const fb = el("p", "feedback", "");
    p.opts.forEach((txt, i) => {
      const b = el("button", "opt", txt);
      b.type = "button";
      b.id = "opt-" + atual + "-" + i;
      b.addEventListener("click", () => responder(i, b, fb, opts));
      opts.appendChild(b);
    });
    card.append(eb, q, opts, fb);
  }

  function responder(i, b, fb, opts) {
    const p = PERGUNTAS[atual];
    if (i !== p.certa) {
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      b.disabled = true;
      fb.className = "feedback bad";
      fb.textContent = ZOEIRAS[erros++ % ZOEIRAS.length];
      return;
    }
    b.classList.add("right");
    opts.querySelectorAll("button").forEach(x => x.disabled = true);
    fb.className = "feedback good";
    fb.textContent = "Acertou! Um gênio.";
    vela(atual, "lit");
    placar(atual + 1);
    setTimeout(() => { atual++; atual < PERGUNTAS.length ? render() : fim(); }, 900);
  }

  function fim() {
    card.innerHTML = "";
    card.append(
      el("p", "eyebrow", "3 de 3"),
      el("h2", "q", "Todas as velas acesas. Agora faz um pedido e assopra."),
    );
    const b = el("button", "btn", "Assoprar as velas");
    b.type = "button"; b.id = "assoprar";
    b.addEventListener("click", premio);
    card.appendChild(b);
  }

  function premio() {
    [0, 1, 2].forEach(i => vela(i, "out"));
    score.textContent = "Pedido feito";
    confete();
    const codigo = atob(CODIGO_B64);
    card.innerHTML = "";
    const row = el("div", "code-row");
    const code = el("span", "code", codigo);
    const copiar = el("button", "btn", "Copiar código");
    copiar.type = "button"; copiar.id = "copiar";
    copiar.addEventListener("click", () => {
      const ok = () => { copiar.textContent = "Copiado"; };
      const falha = () => {
        const r = document.createRange(); r.selectNodeContents(code);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        copiar.textContent = "Selecionado, é só dar Ctrl+C";
      };
      try { navigator.clipboard.writeText(codigo).then(ok, falha); } catch (e) { falha(); }
    });
    row.append(code, copiar);
    card.append(
      el("p", "eyebrow", "Seu presente"),
      el("h2", "q", "Parabéns, Daniel. Você é oficialmente inteligente."),
      el("p", "", "Copia esse código e manda pro Caio. Em troca, ele te entrega o presente de verdade."),
      row,
      el("p", "fine", "Não perde. O Caio não tem paciência pra segunda via."),
    );
  }

  function el(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
  }

  function confete() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
    const W = cv.width = innerWidth, H = cv.height = innerHeight;
    const cores = ["#ffb020", "#18a58a", "#d7263d", "#3b1f14", "#ffc2d1"];
    const ps = Array.from({ length: 160 }, () => ({
      x: W / 2 + (Math.random() - .5) * 80, y: H * .35,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
      r: Math.random() * 6 + 4, a: Math.random() * 6, va: (Math.random() - .5) * .3,
      c: cores[(Math.random() * cores.length) | 0],
    }));
    let t = 0;
    (function frame() {
      cx.clearRect(0, 0, W, H);
      ps.forEach(p => {
        p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
        cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore();
      });
      if (++t < 220) requestAnimationFrame(frame); else cx.clearRect(0, 0, W, H);
    })();
  }

  render();
</script>
</body>
</html>
